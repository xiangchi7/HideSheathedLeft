; ---------------------------------------------------------------------------
;  HideSheathedLeft -- Dark Souls III 1.15.0
;
;  This file is re-read every few seconds.  Edit it, save, and the change takes
;  effect while the game is running -- no restart needed.  A missing file means
;  "all defaults".
; ---------------------------------------------------------------------------

[general]

; 1 = hide the model of the item held in the LEFT hand while that item is
;     sheathed (the normal case: you two-hand the RIGHT-hand weapon, so the
;     left weapon/shield would be displayed hanging on your back).
; 0 = off (vanilla behaviour).
HideLeftHang=1

; 1 = also hide the spare blade(s) of a PAIRED weapon (models 1..3) while the
;     weapon is used one-handed in the RIGHT hand.  Paired weapons normally
;     show the second blade on the body.
; 0 = off.
HidePairedOffhand=1

; How often the patch is re-applied and this file is re-read, in seconds.
IntervalSeconds=4

; 1 = write HideSheathedLeft.log next to this file.
Log=1


; ---------------------------------------------------------------------------
;  Mod loader shell
;
;  The game imports XINPUT1_3.dll by ordinal and Windows resolves imported DLLs
;  from the game folder first, so that file name is the earliest automatic way
;  into the process -- but only one file can own it.  This shell mirrors the
;  real DLL's full export table (forwarding everything to
;  %SystemRoot%\System32\xinput1_3.dll) and then loads other mod DLLs itself,
;  so any number of mods can share the slot.
; ---------------------------------------------------------------------------

[loader]

; 1 = also load this mod's core (HideSheathedLeft.dll).
; 0 = use this DLL purely as a mod loader; it then changes nothing by itself.
LoadCore=1

; Extra DLLs to load, separated by commas or semicolons.  Relative paths are
; resolved against the game folder; absolute paths also work.
;
; Example: a mod that documents itself as "rename this DLL to xinput1_3.dll and
; drop it in the game folder" only wanted the import slot as a way in -- rename
; it to anything else, list it here, and the forwarding duty is handled by this
; shell instead.
;
; Example: ExtraMods=dkp_loader.dll, SomeOtherMod.dll
ExtraMods=dkp_loader.dll

; When to load them:
;   0      = immediately, while the game's imports are being resolved (earlier
;            than any launcher or injector could manage -- needed by mods that
;            patch or redirect something during start-up)
;   > 0    = wait this many milliseconds, then load from a background thread
;            (for mods that need the game to be further along)
ExtraModsDelayMs=0
